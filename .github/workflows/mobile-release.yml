name: Android and iOS release

on:
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: 'Explicitly allow a development release without distribution signing'
        type: boolean
        default: false
      publish_release:
        description: 'Publish the release after both platform builds succeed'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-release.yml'
      - 'scripts/release/**'
      - 'release/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.existing.outputs.build }}
      android_keystore: ${{ steps.signing.outputs.android_keystore }}
      android_store_password: ${{ steps.signing.outputs.android_store_password }}
      android_alias: ${{ steps.signing.outputs.android_alias }}
      android_key_password: ${{ steps.signing.outputs.android_key_password }}
      ios_certificate: ${{ steps.signing.outputs.ios_certificate }}
      ios_password: ${{ steps.signing.outputs.ios_password }}
      ios_profile: ${{ steps.signing.outputs.ios_profile }}
      ios_ready: ${{ steps.signing.outputs.ios_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: metadata
        run: node scripts/release/metadata.mjs >> "$GITHUB_OUTPUT"
      - id: existing
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Release tag $RELEASE_TAG already exists; bump the app version to cut another release."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Identify configured signing secrets (names only)
        id: signing
        if: steps.existing.outputs.build == 'true'
        env:
          BMM_ANDROID_KEYSTORE_SECRET: ${{ secrets.BMM_ANDROID_KEYSTORE_BASE64 && 'BMM_ANDROID_KEYSTORE_BASE64' || secrets.ANDROID_KEYSTORE_BASE64 && 'ANDROID_KEYSTORE_BASE64' || secrets.ANDROID_SIGNING_KEY && 'ANDROID_SIGNING_KEY' || secrets.KEYSTORE_BASE64 && 'KEYSTORE_BASE64' || secrets.SIGNING_KEY && 'SIGNING_KEY' || secrets.ANDROID_KEYSTORE && 'ANDROID_KEYSTORE' || '' }}
          BMM_ANDROID_STORE_PASSWORD_SECRET: ${{ secrets.BMM_ANDROID_KEYSTORE_PASSWORD && 'BMM_ANDROID_KEYSTORE_PASSWORD' || secrets.ANDROID_KEYSTORE_PASSWORD && 'ANDROID_KEYSTORE_PASSWORD' || secrets.KEYSTORE_PASSWORD && 'KEYSTORE_PASSWORD' || secrets.KEY_STORE_PASSWORD && 'KEY_STORE_PASSWORD' || secrets.STORE_PASSWORD && 'STORE_PASSWORD' || '' }}
          BMM_ANDROID_ALIAS_SECRET: ${{ secrets.BMM_ANDROID_KEY_ALIAS && 'BMM_ANDROID_KEY_ALIAS' || secrets.ANDROID_KEY_ALIAS && 'ANDROID_KEY_ALIAS' || secrets.KEY_ALIAS && 'KEY_ALIAS' || secrets.SIGNING_KEY_ALIAS && 'SIGNING_KEY_ALIAS' || secrets.ALIAS && 'ALIAS' || '' }}
          BMM_ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.BMM_ANDROID_KEY_PASSWORD && 'BMM_ANDROID_KEY_PASSWORD' || secrets.ANDROID_KEY_PASSWORD && 'ANDROID_KEY_PASSWORD' || secrets.KEY_PASSWORD && 'KEY_PASSWORD' || secrets.SIGNING_KEY_PASSWORD && 'SIGNING_KEY_PASSWORD' || '' }}
          BMM_IOS_CERTIFICATE_SECRET: ${{ secrets.BMM_IOS_CERTIFICATE_BASE64 && 'BMM_IOS_CERTIFICATE_BASE64' || secrets.BUILD_CERTIFICATE_BASE64 && 'BUILD_CERTIFICATE_BASE64' || secrets.IOS_CERTIFICATE_P12_BASE64 && 'IOS_CERTIFICATE_P12_BASE64' || secrets.IOS_CERTIFICATE_BASE64 && 'IOS_CERTIFICATE_BASE64' || secrets.APPLE_CERTIFICATE_BASE64 && 'APPLE_CERTIFICATE_BASE64' || secrets.IOS_P12_BASE64 && 'IOS_P12_BASE64' || secrets.APPLE_P12_BASE64 && 'APPLE_P12_BASE64' || secrets.CERTIFICATE_BASE64 && 'CERTIFICATE_BASE64' || secrets.IOS_CERTIFICATE_P12 && 'IOS_CERTIFICATE_P12' || secrets.IOS_CERTIFICATE && 'IOS_CERTIFICATE' || '' }}
          BMM_IOS_PASSWORD_SECRET: ${{ secrets.BMM_IOS_CERT_PASSWORD && 'BMM_IOS_CERT_PASSWORD' || secrets.P12_PASSWORD && 'P12_PASSWORD' || secrets.IOS_P12_PASSWORD && 'IOS_P12_PASSWORD' || secrets.IOS_CERT_PASSWORD && 'IOS_CERT_PASSWORD' || secrets.IOS_CERTIFICATE_PASSWORD && 'IOS_CERTIFICATE_PASSWORD' || secrets.APPLE_CERTIFICATE_PASSWORD && 'APPLE_CERTIFICATE_PASSWORD' || secrets.APPLE_P12_PASSWORD && 'APPLE_P12_PASSWORD' || secrets.CERTIFICATE_PASSWORD && 'CERTIFICATE_PASSWORD' || '' }}
          BMM_IOS_PROFILE_SECRET: ${{ secrets.BMM_IOS_PROFILE_BASE64 && 'BMM_IOS_PROFILE_BASE64' || secrets.BUILD_PROVISION_PROFILE_BASE64 && 'BUILD_PROVISION_PROFILE_BASE64' || secrets.IOS_PROVISIONING_PROFILE_BASE64 && 'IOS_PROVISIONING_PROFILE_BASE64' || secrets.PROVISIONING_PROFILE_BASE64 && 'PROVISIONING_PROFILE_BASE64' || secrets.IOS_PROVISION_PROFILE_BASE64 && 'IOS_PROVISION_PROFILE_BASE64' || secrets.IOS_PROFILE_BASE64 && 'IOS_PROFILE_BASE64' || secrets.APPLE_PROVISIONING_PROFILE_BASE64 && 'APPLE_PROVISIONING_PROFILE_BASE64' || secrets.IOS_PROVISIONING_PROFILE && 'IOS_PROVISIONING_PROFILE' || secrets.PROVISIONING_PROFILE && 'PROVISIONING_PROFILE' || '' }}
          BMM_ALLOW_UNSIGNED: ${{ inputs.allow_unsigned || false }}
        run: node scripts/release/signing-secrets.mjs

  android:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies and run checks
        run: |
          npm ci
          npm test
      - name: Build and synchronize bundled Android game
        run: npm run mobile:sync:android
      - name: Install Android SDK platform
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Configure optional Android distribution signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets[needs.version.outputs.android_keystore] }}
          KEYSTORE_PASSWORD: ${{ secrets[needs.version.outputs.android_store_password] }}
          KEY_ALIAS: ${{ secrets[needs.version.outputs.android_alias] }}
          KEY_PASSWORD: ${{ secrets[needs.version.outputs.android_key_password] }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/battle-monsters-upload.jks"
            echo "BMM_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/battle-monsters-upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Distribution signing is not configured; building a development-signed APK and unsigned AAB."
          fi
      - name: Compile Android APK and App Bundle
        working-directory: android
        env:
          BMM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets[needs.version.outputs.android_store_password] }}
          BMM_ANDROID_KEY_ALIAS: ${{ secrets[needs.version.outputs.android_alias] }}
          BMM_ANDROID_KEY_PASSWORD: ${{ secrets[needs.version.outputs.android_key_password] }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Package Android artifacts
        env:
          BMM_ANDROID_SIGNED: ${{ steps.signing.outputs.signed }}
        run: node scripts/release/package.mjs android
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: distribution/android/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/battle-monsters-upload.jks"

  ios:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and verify toolchain
        run: |
          npm ci
          xcodebuild -version
          pod --version
      - name: Build and synchronize bundled iOS game
        run: npm run mobile:sync:ios
      - name: Configure and validate Apple distribution signing
        if: needs.version.outputs.ios_ready == 'true'
        env:
          BMM_IOS_CERTIFICATE_BASE64: ${{ secrets[needs.version.outputs.ios_certificate] }}
          BMM_IOS_CERT_PASSWORD: ${{ secrets[needs.version.outputs.ios_password] }}
          BMM_IOS_PROFILE_BASE64: ${{ secrets[needs.version.outputs.ios_profile] }}
        run: node scripts/release/ios-signing.mjs
      - name: Compile universal iOS simulator app
        run: >-
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath work/ios-simulator
          CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build
      - name: Compile unsigned iOS device archive
        if: needs.version.outputs.ios_ready != 'true'
        run: >-
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -archivePath work/BattleMonstersMobile.xcarchive
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Compile signed iOS device archive
        if: needs.version.outputs.ios_ready == 'true'
        run: >-
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -archivePath work/BattleMonstersMobile.xcarchive archive
      - name: Export signed iOS IPA
        if: needs.version.outputs.ios_ready == 'true'
        run: >-
          xcodebuild -exportArchive
          -archivePath work/BattleMonstersMobile.xcarchive
          -exportOptionsPlist "$BMM_IOS_EXPORT_OPTIONS"
          -exportPath work/ios-export
      - name: Package simulator app and unsigned device build
        run: node scripts/release/package.mjs ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: distribution/ios/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary Apple signing material
        if: always()
        run: node scripts/release/ios-signing.mjs cleanup

  publish:
    needs: [version, android, ios]
    if: needs.version.outputs.build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: distribution/release
          merge-multiple: true
      - name: Package source, checksums, and provenance
        run: node scripts/release/package.mjs release
      - name: Publish Android and iOS development release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" distribution/release/* \
            --repo "$REPOSITORY" --target "$COMMIT_SHA" \
            --title "Battle Monsters Mobile $RELEASE_TAG — Android & iOS development builds" \
            --notes-file release/NOTES.md --prerelease
